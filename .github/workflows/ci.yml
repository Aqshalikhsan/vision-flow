name: CI

on:
  push:
    # Was pinned to one feature branch, so work on any other branch went
    # unverified until it reached main. Match them all instead.
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Check frontend formatting
        run: npm run format:check

      - name: Run API smoke tests
        env:
          # The smoke suite exercises project APIs directly. Production keeps
          # authentication enabled through compose.ugreen.yml; CI uses an
          # isolated ephemeral database and disables it only for this test.
          VISIONFLOW_REQUIRE_AUTH: "0"
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          api_pid=$!
          trap 'kill $api_pid' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          python backend/smoke_test.py

      - name: Build and run browser tests
        env:
          PYTHON_EXECUTABLE: python
        run: npm run test:e2e
